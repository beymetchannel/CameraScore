}
let padMap = loadPadMap();

/* ── FINISH バナー + Canvas演出 ──────────────────
   演出はすべて1枚のCanvas(低解像度で描画→CSSで拡大)で行い、
   DOMアニメーションは transform/opacity のみ。重い場合は FX_SCALE を下げる。 */
const FX_SCALE = 0.5;   // Canvas解像度の倍率（0.45=より軽い / 0.8=より綺麗）
let finishFxEl = null;
let finishEndAt = 0;   // 現在のFINISH演出が終わる時刻(performance.now基準)
let finishTimers = [];
let finishCancel = null;

const rnd = (a, b) => a + Math.random() * (b - a);

/* ── Canvas演出 共通ヘルパー ───────────────────── */
const TAU = Math.PI * 2;
const SPR_CACHE = {};
/* 柔らかい発光スプライト（加算合成で使う。shadowBlurより圧倒的に軽い） */
function glowSprite(rgb) {
  if (SPR_CACHE[rgb]) return SPR_CACHE[rgb];
  const S = 128, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d"), r = S / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0,    `rgba(${rgb},1)`);
  gr.addColorStop(0.18, `rgba(${rgb},.72)`);
  gr.addColorStop(0.45, `rgba(${rgb},.26)`);
  gr.addColorStop(1,    `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  return (SPR_CACHE[rgb] = c);
}
function drawSpr(ctx, s, x, y, w, a, h) {              // h省略で正円
  if (a <= 0.003 || w <= 0) return;
  const hh = h === undefined ? w : h;
  ctx.globalAlpha = a; ctx.drawImage(s, x - w / 2, y - hh / 2, w, hh);
}
function polyPath(ctx, cx, cy, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = rot + i / n * TAU, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
}
/* 中点変位法の稲妻 */
function boltPts(x0, y0, x1, y1, rough, depth) {
  let pts = [[x0, y0], [x1, y1]], off = rough;
  for (let d = 0; d < depth; d++) {
    const np = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, o = rnd(-off, off);
      np.push([(a[0] + b[0]) / 2 - dy / l * o, (a[1] + b[1]) / 2 + dx / l * o]); np.push(b);
    }
    pts = np; off *= 0.55;
  }
  return pts;
}
function strokePts(ctx, pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}

/* XTREME: ネオンの稲妻 + 六角衝撃波 + アナモフィックフレア（マゼンタ/バイオレット/シアン） */
function simXtreme(W, H, ctx) {
  const cx = W / 2, cy = H * 0.3, R = Math.hypot(W, H) * 0.6, u = W / 1000;
  const sMag = glowSprite("255,50,220"), sVio = glowSprite("130,70,255"), sCyn = glowSprite("40,230,255"), sWht = glowSprite("255,255,255");
  const cols = ["255,70,225", "150,80,255", "50,225,255", "255,255,255"];
  const P = [];
  const burst = (n, spd, delay) => {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), v = spd * u * rnd(0.25, 1);
      P.push({ x:cx, y:cy, vx:Math.cos(a) * v, vy:Math.sin(a) * v, d:delay, life:0, max:rnd(0.6, 1.5),
               w:rnd(1.5, 4) * u, c:cols[(Math.random() * 4) | 0], sq:Math.random() < 0.3 });
    }
  };
  burst(60, 1300, 0); burst(36, 900, 0.2); burst(20, 600, 0.45);
  let bolts = [], nextBolt = 0;
  const makeBolts = () => {
    bolts = [];
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + rnd(-0.3, 0.3), L = R * rnd(0.55, 1);
      const main = boltPts(cx, cy, cx + Math.cos(a) * L, cy + Math.sin(a) * L, L * 0.12, 5);
      bolts.push({ pts:main, c:i % 2, w:1 });
      const k = main[(main.length * rnd(0.3, 0.6)) | 0], b = a + rnd(-0.8, 0.8), L2 = L * rnd(0.25, 0.4);
      bolts.push({ pts:boltPts(k[0], k[1], k[0] + Math.cos(b) * L2, k[1] + Math.sin(b) * L2, L2 * 0.12, 4), c:i % 2, w:0.55 });
    }
  };
  return (dt, t) => {
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = Math.min(1, t / 0.2) * 0.34; ctx.fillStyle = "#10002a"; ctx.fillRect(0, 0, W, H);   // 暗幕でネオンを際立たせる
    if (t < 0.14) { ctx.globalAlpha = 0.85 * (1 - t / 0.14); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); }
    ctx.globalCompositeOperation = "lighter";
    const ge = Math.max(0, 1 - t / 2.2), pulse = 1 + 0.06 * Math.sin(t * 38);
    drawSpr(ctx, sVio, cx, cy, W * 0.95 * (0.55 + 0.45 * Math.min(1, t / 0.25)) * pulse, 0.85 * ge);
    drawSpr(ctx, sWht, cx, cy, W * 0.12 * pulse, 0.9 * ge);
    const se = Math.max(0, 1 - t / 0.95);                                    // アナモフィックフレア
    drawSpr(ctx, sMag, cx, cy, W * 1.5, 0.75 * se, 40 * u);
    drawSpr(ctx, sCyn, cx, cy, W * 1.1, 0.7 * se, 16 * u);
    drawSpr(ctx, sWht, cx, cy, W * 0.8, 0.9 * se, 6 * u);
    for (let i = 0; i < 3; i++) {                                            // 衝撃波（円 / 六角 / 円）
      const rt = t - i * 0.1;
      if (rt <= 0 || rt >= 0.9) continue;
      const k = 1 - Math.pow(1 - rt / 0.9, 3), r = k * R * 0.9, a = 1 - rt / 0.9, col = i % 2 ? "50,225,255" : "255,60,225";
      const path = () => i === 1 ? polyPath(ctx, cx, cy, r, 6, t * 1.2) : (ctx.beginPath(), ctx.arc(cx, cy, r, 0, TAU));
      ctx.globalAlpha = 1; ctx.lineJoin = "miter";
      ctx.strokeStyle = `rgba(${col},${0.22 * a})`; ctx.lineWidth = (20 * a + 3) * u; path(); ctx.stroke();
      ctx.strokeStyle = `rgba(${col},${0.8 * a})`;  ctx.lineWidth = (5 * a + 1) * u;  path(); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${0.9 * a})`; ctx.lineWidth = 1.4 * u;      path(); ctx.stroke();
    }
    if (t < 1.9) {                                                           // 稲妻（毎フレーム近く再生成してちらつかせる）
      if (t >= nextBolt) { makeBolts(); nextBolt = t + rnd(0.07, 0.11); }
      const env = Math.pow(Math.max(0, 1 - t / 1.9), 1.3) * (0.7 + 0.3 * Math.random()) * (t > 0.85 && t < 1.0 ? 1.8 : 1);   // 0.9秒付近で再放電
      ctx.globalAlpha = 1; ctx.lineJoin = "round"; ctx.lineCap = "round";
      for (const b of bolts) {
        const mid = b.c ? "60,230,255" : "255,60,230";
        ctx.strokeStyle = `rgba(${mid},${0.55 * env})`;     ctx.lineWidth = 6 * u * b.w;  strokePts(ctx, b.pts);
        ctx.strokeStyle = `rgba(255,255,255,${0.95 * env})`; ctx.lineWidth = 1.5 * u * b.w; strokePts(ctx, b.pts);
      }
    }
    const drag = Math.exp(-2.4 * dt);                                        // ネオンの火花 / データ片
    ctx.lineCap = "round";
    for (const p of P) {
      if (p.d > 0) { p.d -= dt; continue; }
      p.life += dt; if (p.life > p.max) continue;
      p.vx *= drag; p.vy = p.vy * drag + 180 * u * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.life / p.max, a = (1 - k) * (0.6 + 0.4 * Math.random());
      ctx.globalAlpha = 1;
      if (p.sq) { ctx.fillStyle = `rgba(${p.c},${a})`; const s = p.w * 2.4; ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s); }
      else { ctx.strokeStyle = `rgba(${p.c},${a})`; ctx.lineWidth = p.w * (1 - k * 0.5); ctx.beginPath(); ctx.moveTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    }
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  };
}

/* BURST: 派手な多段爆発（閃光 → 3連続の火球 → 光条 → 衝撃波 → 火花 → 黒煙・残り火） */
function simBurst(W, H, ctx) {
  const cx = W / 2, cy = H * 0.3, u = W / 1000;
  const heat = ["255,252,235", "255,236,160", "255,196,80", "255,136,34", "228,72,16", "140,32,10"].map(glowSprite);
  const smk = glowSprite("34,24,20"), emb = glowSprite("255,150,40");
  const blasts = [[0, 0, 0, 1], [0.16, -0.16, 0.05, 0.8], [0.3, 0.18, -0.04, 0.85]];   // [遅延, x, y, 大きさ]
  const FI = [], SM = [], SP = [], EM = [], RAY = [];
  for (const [dl, bx, by, sz] of blasts) {
    const x0 = cx + bx * W, y0 = cy + by * H;
    for (let i = 0; i < 40; i++) {
      const a = rnd(0, TAU), v = rnd(60, 700) * u * sz, o = rnd(0, 24 * u);
      FI.push({ x:x0 + Math.cos(a) * o, y:y0 + Math.sin(a) * o, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 50 * u,
                d:dl + rnd(0, 0.2), life:0, max:rnd(0.8, 1.5), s0:rnd(100, 210) * u * sz, g:rnd(1.8, 2.6) });
    }
    for (let i = 0; i < 8; i++) {
      const a = rnd(0, TAU), v = rnd(30, 260) * u;
      SM.push({ x:x0, y:y0, vx:Math.cos(a) * v, vy:Math.sin(a) * v, d:dl + rnd(0.1, 0.5), life:0, max:rnd(1.5, 2.4), s0:rnd(170, 280) * u * sz, g:rnd(1.8, 2.8) });
    }
  }
  const sc = ["255,250,210", "255,214,110", "255,160,50"];
  for (let i = 0; i < 90; i++) {                                            // 外へ走る火花
    const a = rnd(0, TAU), v = rnd(500, 2200) * u;
    SP.push({ x:cx, y:cy, vx:Math.cos(a) * v, vy:Math.sin(a) * v, d:rnd(0, 0.3), life:0, max:rnd(0.4, 1.1), w:rnd(1.2, 3.2) * u, c:sc[i % 3] });
  }
  for (let i = 0; i < 30; i++) EM.push({ x:cx + rnd(-1, 1) * W * 0.15, y:cy + rnd(-1, 1) * H * 0.1, vx:rnd(-60, 60) * u, vy:rnd(-140, -30) * u, d:rnd(0.1, 0.8), life:0, max:rnd(1.2, 2.4), ph:rnd(0, TAU) });
  for (let i = 0; i < 22; i++) RAY.push({ a:rnd(0, TAU), w:rnd(0.008, 0.03), l:rnd(0.5, 1.1) });
  return (dt, t) => {
    ctx.save();
    const amp = 20 * u * Math.max(0, 1 - t / 0.8);
    if (amp > 0.2) ctx.translate(rnd(-amp, amp), rnd(-amp, amp));
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = Math.min(1, t / 0.15) * 0.3; ctx.fillStyle = "#0a0402"; ctx.fillRect(-40, -40, W + 80, H + 80);
    const sdrag = Math.exp(-1.6 * dt);
    for (const p of SM) {
      if (p.d > 0) { p.d -= dt; continue; }
      p.life += dt; if (p.life > p.max) continue;
      p.vx *= sdrag; p.vy = p.vy * sdrag - 70 * u * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.life / p.max;
      drawSpr(ctx, smk, p.x, p.y, p.s0 * (1 + p.g * k), (k < 0.15 ? k / 0.15 : 1) * (1 - k) * 0.5);
    }
    ctx.globalCompositeOperation = "lighter";
    const fdrag = Math.exp(-2.2 * dt);
    for (const p of FI) {
      if (p.d > 0) { p.d -= dt; continue; }
      p.life += dt; if (p.life > p.max) continue;
      p.vx *= fdrag; p.vy = p.vy * fdrag - 120 * u * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.life / p.max, idx = Math.min(5, 1 + ((k * 5.6) | 0));
      drawSpr(ctx, heat[idx], p.x, p.y, p.s0 * (0.6 + p.g * k), (k < 0.08 ? k / 0.08 : Math.pow(1 - k, 1.4)) * 0.5);
    }
    if (t < 0.6) {                                                           // 放射状の光条
      const e = 1 - t / 0.6; ctx.globalAlpha = 0.16 * e; ctx.fillStyle = "rgb(255,190,100)";
      const L = W * (0.3 + 0.9 * (1 - e));
      for (const r of RAY) {
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(r.a - r.w) * L * r.l, cy + Math.sin(r.a - r.w) * L * r.l);
        ctx.lineTo(cx + Math.cos(r.a + r.w) * L * r.l, cy + Math.sin(r.a + r.w) * L * r.l); ctx.fill();
      }
    }
    for (const [dl, bx, by, sz] of blasts) {                                 // 各爆発の中心閃光
      const k = t - dl; if (k < 0 || k > 0.5) continue;
      const e = 1 - k / 0.5, x = cx + bx * W, y = cy + by * H;
      drawSpr(ctx, heat[0], x, y, W * 0.5 * sz * e, 0.7 * e);
    }
    const se = Math.max(0, 1 - t / 0.8);
    drawSpr(ctx, heat[2], cx, cy, W * 1.6, 0.8 * se, 40 * u);
    drawSpr(ctx, heat[0], cx, cy, W * 1.0, 0.9 * se, 10 * u);
    for (let i = 0; i < 2; i++) {                                            // 衝撃波（2波）
      const rt = t - i * 0.18; if (rt <= 0 || rt >= 0.8) continue;
      const k = 1 - Math.pow(1 - rt / 0.8, 2.6), r = k * W * 0.8, a = 1 - rt / 0.8;
      ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(255,200,120,${0.35 * a})`; ctx.lineWidth = (26 * a + 3) * u; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(60,220,255,${0.5 * a})`;   ctx.lineWidth = 2 * u;           ctx.beginPath(); ctx.arc(cx, cy, r * 1.03, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,240,${0.9 * a})`;  ctx.lineWidth = (3 * a + 1) * u;  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    }
    const gdrag = Math.exp(-1.6 * dt);
    ctx.lineCap = "round"; ctx.globalAlpha = 1;
    for (const p of SP) {
      if (p.d > 0) { p.d -= dt; continue; }
      p.life += dt; if (p.life > p.max) continue;
      p.vx *= gdrag; p.vy *= gdrag; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.life / p.max;
      ctx.strokeStyle = `rgba(${p.c},${1 - k * k})`; ctx.lineWidth = p.w * (1 - k * 0.5);
      ctx.beginPath(); ctx.moveTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    for (const p of EM) {
      if (p.d > 0) { p.d -= dt; continue; }
      p.life += dt; if (p.life > p.max) continue;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.life / p.max;
      drawSpr(ctx, emb, p.x, p.y, 16 * u * (1 - k * 0.4), (1 - k) * (0.55 + 0.45 * Math.sin(t * 30 + p.ph)));
    }
    ctx.globalCompositeOperation = "source-over";
    if (t < 0.09) { ctx.globalAlpha = 0.9 * (1 - t / 0.09); ctx.fillStyle = "#fff"; ctx.fillRect(-40, -40, W + 80, H + 80); }
    ctx.restore();
  };
}

/* OVER: 手前のガラス板に衝撃 → ひび割れ → 破片がこちら（カメラ側）へ勢いよく砕け飛んでくる（疑似3D） */
function simOver(W, H, ctx) {
  const cx = W / 2, cy = H * 0.3, base = Math.hypot(W, H), F = base * 0.55, u = W / 1000;
  const NA = 20, RF = [0, 0.03, 0.07, 0.12, 0.19, 0.29, 0.43, 0.62, 0.85, 1.1], NR = RF.length;
  const V = [];
  for (let i = 0; i < NA; i++) {
    V[i] = [];
    for (let j = 0; j < NR; j++) {
      const a = (i + rnd(-0.32, 0.32)) / NA * TAU, r = j === 0 ? 0 : RF[j] * base * (j === NR - 1 ? 1 : rnd(0.86, 1.14));
      V[i][j] = [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }
  }
  const C = [];
  const add = (pts, rj) => {
    let mx = 0, my = 0; for (const p of pts) { mx += p[0]; my += p[1]; } mx /= pts.length; my /= pts.length;
    const dx = mx - cx, dy = my - cy, dist = Math.hypot(dx, dy) || 1, n = dist / base;
    const vz = rnd(650, 1900) * (1 - 0.45 * Math.min(1, n * 1.3)), sp = rnd(50, 340);
    C.push({ L:pts.map(p => [p[0] - mx, p[1] - my]), px:dx, py:dy, rj, td:0.62 + n * 0.3 + rnd(0, 0.06),
             vx:dx / dist * sp, vy:dy / dist * sp - rnd(0, 60), vz, z:0, ax:rnd(0, 0.3), ay:rnd(0, 0.3), az:0,
             vax:rnd(-5, 5), vay:rnd(-5, 5), vaz:rnd(-4, 4) });
  };
  for (let i = 0; i < NA; i++) for (let j = 0; j < NR - 1; j++) {
    const p0 = V[i][j], p1 = V[(i + 1) % NA][j], p2 = V[(i + 1) % NA][j + 1], p3 = V[i][j + 1], rj = RF[j] * base;
    if (j === 0) add([p0, p2, p3], rj);
    else if (Math.random() < 0.5) { add([p0, p1, p2], rj); add([p0, p2, p3], rj); }
    else add([p0, p1, p2, p3], rj);
  }
  C.sort((a, b) => a.vz - b.vz);                                            // 奥 → 手前 の順で描く
  const G = [];                                                              // 細かいガラス粉
  for (let i = 0; i < 240; i++) {
    const a = rnd(0, TAU), r = Math.pow(Math.random(), 1.5) * base * 0.6;
    G.push({ x:Math.cos(a) * r, y:Math.sin(a) * r, vx:Math.cos(a) * rnd(80, 500), vy:Math.sin(a) * rnd(80, 500), z:0, vz:rnd(900, 2800),
             d:0.62 + r / base * 0.3 + rnd(0, 0.1), sz:rnd(2, 7) * u, c:Math.random() < 0.6 ? "220,255,250" : "120,255,225" });
  }
  const sCore = glowSprite("200,255,248");
  const LX = -0.48, LY = -0.58, LZ = 0.66;                                   // 光源方向
  return (dt, t) => {
    ctx.globalCompositeOperation = "source-over";
    if (t < 0.12) { ctx.globalAlpha = 0.75 * (1 - t / 0.12); ctx.fillStyle = "#eafffb"; ctx.fillRect(0, 0, W, H); }
    const reveal = t * base * 2.4;                                           // ひびの伝播
    ctx.lineJoin = "round";
    for (const c of C) {
      if (c.rj > reveal) continue;
      const flying = t > c.td;
      if (flying) { c.px += c.vx * dt; c.py += c.vy * dt; c.z += c.vz * dt; c.ax += c.vax * dt; c.ay += c.vay * dt; c.az += c.vaz * dt; }
      const depth = c.z / F;
      let alpha = depth < 0.55 ? 1 : Math.max(0, 1 - (depth - 0.55) / 0.35);
      if (alpha <= 0) continue;
      const ca = Math.cos(c.ax), sa = Math.sin(c.ax), cb = Math.cos(c.ay), sb = Math.sin(c.ay), cg = Math.cos(c.az), sg = Math.sin(c.az);
      const xs = [], ys = [];
      let dead = false, sx = 0, sy = 0, sAvg = 0;
      for (const q of c.L) {
        const x = q[0] * cg - q[1] * sg, y = q[0] * sg + q[1] * cg;           // Z回転 → X回転 → Y回転
        const y1 = y * ca, z1 = y * sa;
        const x2 = x * cb + z1 * sb, z2 = -x * sb + z1 * cb, Zw = c.z + z2;
        if (Zw >= F * 0.93) { dead = true; break; }
        const s = F / (F - Zw), X = cx + (c.px + x2) * s, Y = cy + (c.py + y1) * s;
        xs.push(X); ys.push(Y); sx += X; sy += Y; sAvg += s;
      }
      if (dead) continue;
      const n = xs.length; sx /= n; sy /= n; sAvg /= n;
      const tr = (X, Y) => { ctx.beginPath(); ctx.moveTo(X[0], Y[0]); for (let i = 1; i < n; i++) ctx.lineTo(X[i], Y[i]); ctx.closePath(); };
      const nx = ca * sb, ny = -sa, nz = ca * cb;
      const fres = 1 - Math.abs(nz), spec = Math.pow(Math.abs(nx * LX + ny * LY + nz * LZ), 14);
      ctx.globalCompositeOperation = "source-over";                          // ガラスの面（正面は透明、斜めほど白く：フレネル）
      ctx.globalAlpha = 1; ctx.fillStyle = `rgba(140,255,238,${(0.07 + 0.34 * fres * fres) * alpha})`; tr(xs, ys); ctx.fill();
      ctx.globalCompositeOperation = "lighter";
      if (spec > 0.02) { ctx.fillStyle = `rgba(255,255,255,${spec * 0.8 * alpha})`; ctx.fill(); }   // 反射のきらめき
      const lw = (flying ? 0.75 : 0.5) * u * Math.min(2.2, Math.sqrt(sAvg));
      ctx.strokeStyle = `rgba(235,255,252,${(flying ? 0.38 : 0.2) * alpha})`; ctx.lineWidth = lw; ctx.stroke();   // 断面の縁
      const ix = [], iy = [];                                                // 厚みを感じさせる内側のエッジ
      for (let i = 0; i < n; i++) { ix.push(sx + (xs[i] - sx) * 0.8); iy.push(sy + (ys[i] - sy) * 0.8); }
      tr(ix, iy); ctx.strokeStyle = `rgba(60,255,215,${0.12 * alpha})`; ctx.lineWidth = lw * 0.8; ctx.stroke();
    }
    ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
    if (t < 0.5) {                                                           // 着弾点の閃光とスター
      const k = 1 - t / 0.5;
      drawSpr(ctx, sCore, cx, cy, 220 * u * k + 20 * u, 0.9 * k);
      if (t < 0.3) {
        const e = Math.min(1, t / 0.08), a = 1 - t / 0.3;
        ctx.globalAlpha = 1; ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2 * u;
        for (let i = 0; i < 14; i++) {
          const ang = i / 14 * TAU + 0.2, l = (80 + (i * 53 % 240)) * u * e;
          ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * 12 * u, cy + Math.sin(ang) * 12 * u); ctx.lineTo(cx + Math.cos(ang) * l, cy + Math.sin(ang) * l); ctx.stroke();
        }
      }
    }
    if (t > 0.62 && t < 0.82) { ctx.globalAlpha = 0.22 * (1 - (t - 0.62) / 0.2); ctx.fillStyle = "#7fffe8"; ctx.fillRect(0, 0, W, H); }   // 砕けた瞬間
    for (const g of G) {                                                     // ガラス粉がレンズへ飛んでくる
      if (t < g.d) continue;
      g.x += g.vx * dt; g.y += g.vy * dt; g.z += g.vz * dt;
      if (g.z >= F * 0.9) continue;
      const s = F / (F - g.z), s2 = F / (F - Math.max(0, g.z - g.vz * 0.03));
      const a = Math.max(0, 1 - g.z / (F * 0.9));
      ctx.globalAlpha = 1; ctx.strokeStyle = `rgba(${g.c},${a})`; ctx.lineWidth = Math.max(1, g.sz * s * 0.5);
      ctx.beginPath(); ctx.moveTo(cx + g.x * s2, cy + g.y * s2); ctx.lineTo(cx + g.x * s, cy + g.y * s); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  };
}

/* SPIN: 竜巻を真上から見下ろす（渦の中心＝漏斗の底へ吸い込まれていく） */
function simSpin(W, H, ctx) {
  const cx = W / 2, cy = H * 0.3, u = W / 1000, Rmax = Math.hypot(W, H) * 0.62, re = 46 * u;
  const sHot = glowSprite("255,244,170"), sAmb = glowSprite("255,190,30"), sCyn = glowSprite("60,235,255"), sDark = glowSprite("18,10,0");
  const cols = ["255,214,40", "255,244,160", "255,255,255", "255,168,20", "255,214,40"];
  const omega = r => 1.6 + 11 * Math.pow(re / (r + re * 0.6), 0.9);            // 中心ほど速い（差動回転）
  const inflow = r => 1.6 * r + 150 * u;                                         // 中心へ吸い込まれる速さ
  const spawn = (p, init) => {
    p.r  = init ? re * 1.3 + (Rmax - re * 1.3) * Math.pow(Math.random(), 1.5) : Rmax * rnd(0.75, 1.1);
    p.th = rnd(0, TAU);
  };
  const P = [], CL = [], DK = [];
  for (let i = 0; i < 380; i++) {
    const c = Math.random() < 0.08 ? "60,235,255" : cols[i % 5];
    const p = { st:`rgb(${c})`, s:rnd(1.2, 3.6) * u, chunk:i % 16 === 0, rot:rnd(0, TAU), vr:rnd(-8, 8) };
    spawn(p, true); P.push(p);
  }
  for (let i = 0; i < 110; i++) { const p = { s:rnd(0.7, 1.3), h:i % 9 === 0 }; spawn(p, true); CL.push(p); }
  for (let i = 0; i < 48; i++) { const p = { s:rnd(0.8, 1.4) }; spawn(p, true); DK.push(p); }
  const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rmax);
  vg.addColorStop(0, "rgba(0,0,0,.92)"); vg.addColorStop(re * 1.6 / Rmax, "rgba(8,4,0,.66)");
  vg.addColorStop(0.3, "rgba(14,8,0,.28)"); vg.addColorStop(1, "rgba(0,0,0,.5)");
  let phase = 0;
  const advance = (p, dt) => {                                               // 吸い込まれながら旋回
    p.th += omega(p.r) * dt;
    p.r  -= inflow(p.r) * dt;
    if (p.r < re * 0.9) spawn(p, false);
  };
  return (dt, t) => {
    const fin = Math.min(1, t / 0.4), zoom = 0.55 + 0.45 * fin, fa = fin * 0.5;   // fa: 全体の不透明度
    phase += dt;
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = fa; ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    for (const p of DK) {                                                    // 渦の影（奥行き）
      advance(p, dt);
      const r = p.r * zoom;
      drawSpr(ctx, sDark, cx + Math.cos(p.th) * r, cy + Math.sin(p.th) * r, (160 + r * 0.8) * p.s, 0.32 * fa * Math.min(1, (p.r - re) / (re * 3)));
    }
    ctx.globalCompositeOperation = "lighter";
    for (const p of CL) {                                                    // 渦の雲
      advance(p, dt);
      const r = p.r * zoom, near = 1 - Math.min(1, p.r / Rmax);
      drawSpr(ctx, p.h ? sHot : sAmb, cx + Math.cos(p.th) * r, cy + Math.sin(p.th) * r, (90 + r * 0.55) * p.s, (0.08 + 0.14 * near) * fa * Math.min(1, (p.r - re) / (re * 2.5)));
    }
    ctx.lineWidth = 2 * u; ctx.strokeStyle = "rgb(255,210,60)";               // HUD風の点線リングが中心へ収束
    for (let i = 0; i < 6; i++) {
      const f = (i / 6 + t * 0.35) % 1, r = (re * 1.5 + (Rmax - re * 1.5) * f * f) * zoom;
      ctx.globalAlpha = (1 - f) * 0.32 * fa * Math.min(1, f * 5);
      ctx.setLineDash([r * 0.15, r * 0.1]); ctx.lineDashOffset = -phase * r * 0.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineCap = "round";
    for (const p of P) {                                                     // 螺旋を描いて吸い込まれる粒子（進行方向に尾を引く）
      advance(p, dt);
      const w = omega(p.r), v = inflow(p.r);
      ctx.globalAlpha = fa * (0.35 + 0.65 * Math.min(1, (p.r - re) / (re * 2))) * (0.55 + 0.45 * (p.r / Rmax));
      ctx.strokeStyle = p.st; ctx.lineWidth = p.s * (0.5 + p.r / Rmax * 1.5);
      ctx.beginPath();
      for (let k = 0; k <= 3; k++) {
        const tau = 0.075 * k / 3, rr = (p.r + v * tau) * zoom, th = p.th - w * tau;
        const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    drawSpr(ctx, sAmb, cx, cy, re * 7 * zoom, 0.35 * fa);                    // 漏斗の底の光
    drawSpr(ctx, sCyn, cx, cy, re * 3.4 * zoom, 0.3 * fa);
    ctx.globalAlpha = fa; ctx.lineWidth = 14 * u; ctx.strokeStyle = "rgba(255,190,30,.35)";   // アイウォール（縁）
    ctx.beginPath(); ctx.arc(cx, cy, re * 1.1 * zoom, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2.5 * u; ctx.strokeStyle = `rgba(255,255,230,${0.8 + 0.2 * Math.sin(t * 50)})`;
    ctx.beginPath(); ctx.arc(cx, cy, re * 1.1 * zoom, 0, TAU); ctx.stroke();
    if (t < 0.25) { ctx.globalAlpha = 0.18 * (1 - t / 0.25); ctx.fillStyle = "#ffe650"; ctx.fillRect(0, 0, W, H); }
    ctx.globalCompositeOperation = "source-over";
    for (const p of P) {                                                     // 舞い上がる破片
      if (!p.chunk) continue;
      const r = p.r * zoom, x = cx + Math.cos(p.th) * r, y = cy + Math.sin(p.th) * r, s = p.s * 3.5 * (0.4 + p.r / Rmax * 1.8);
      p.rot += p.vr * dt;
      ctx.globalAlpha = fa * Math.min(1, (p.r - re) / (re * 2));
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
      ctx.fillStyle = "#1a1206"; ctx.fillRect(-s, -s * 0.35, s * 2, s * 0.7);
      ctx.strokeStyle = "rgba(255,190,50,.85)"; ctx.lineWidth = 1.2 * u; ctx.strokeRect(-s, -s * 0.35, s * 2, s * 0.7); ctx.restore();
    }
    ctx.globalAlpha = 1;
  };
}

const FINISH_SIMS = { XTREME:simXtreme, BURST:simBurst, OVER:simOver, SPIN:simSpin };

function startFinishCanvas(key, fx, totalMs) {
  const sim = FINISH_SIMS[key];
  if (!sim) return null;
  const W = window.innerWidth, H = window.innerHeight;
  const cv = document.createElement("canvas");
  cv.className = "fx-canvas";
  cv.width  = Math.round(W * FX_SCALE);
  cv.height = Math.round(H * FX_SCALE);
  fx.insertBefore(cv, fx.firstChild);
  const ctx = cv.getContext("2d");
  ctx.setTransform(FX_SCALE, 0, 0, FX_SCALE, 0, 0);
  const step = sim(W, H, ctx);
  let raf = 0, last = performance.now();
  const t0 = last;
  const frame = now => {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    ctx.clearRect(-60, -60, W + 120, H + 120);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    step(dt, (now - t0) / 1000);
    if (now - t0 < totalMs) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

function showFinishBanner(side, key) {
  const f = FINISHES[key];
  if (!f) return;
  if (finishFxEl) { finishFxEl.remove(); finishFxEl = null; }
  finishTimers.forEach(clearTimeout); finishTimers = [];
  if (finishCancel) { finishCancel(); finishCancel = null; }
  playFinishSound(key);

  const fx = document.createElement("div");
  fx.className = `finish-fx ${side} fx-${key.toLowerCase()}`;
  fx.innerHTML = `<div class="finish-banner"><div class="fb-band"><div class="fb-name"><span class="fb-txt"></span></div></div></div>`;
  const nm = fx.querySelector(".fb-name");
  nm.dataset.text = f.label;                                  // 色収差(RGBずれ)用の疑似要素が参照
  nm.querySelector(".fb-txt").textContent = f.label;
  document.body.appendChild(fx);
  finishFxEl = fx;
  finishEndAt = performance.now() + FINISH_SHOW_MS + FINISH_FADE_MS;
  finishCancel = startFinishCanvas(key, fx, FINISH_SHOW_MS + FINISH_FADE_MS);

  finishTimers.push(setTimeout(() => fx.classList.add("out"), FINISH_SHOW_MS));
  finishTimers.push(setTimeout(() => {
    fx.remove();
    if (finishFxEl === fx) { finishFxEl = null; if (finishCancel) { finishCancel(); finishCancel = null; } }
  }, FINISH_SHOW_MS + FINISH_FADE_MS));
}

function scoreFinish(side, key) {
  showFinishBanner(side, key);
  addPoint(side, FINISHES[key].pts);
}

/* ── アクション実行 ─────────────────────────────── */
const padPending    = { left:null, right:null };
const padBlockUntil = { left:0, right:0 };

function fireAction(a) {
  if (a.type === "undo") { removePoint(a.side); return; }

  const side = a.side;
  const now  = performance.now();
  if (now < padBlockUntil[side]) return;

  // 同じ側で極短時間に2つのFINISHが押された(十字の斜め押し等) → どちらか判別不能なので両方無効
  if (padPending[side]) {
    clearTimeout(padPending[side]);
    padPending[side] = null;
    padBlockUntil[side] = now + 300;
    return;
  }
  padPending[side] = setTimeout(() => {
    padPending[side] = null;
    if (!currentMode || gameBlocked) return;
    padBlockUntil[side] = performance.now() + FINISH_LOCKOUT_MS;
    scoreFinish(side, a.finish);
  }, SIMUL_GUARD_MS);
}

/* ── Gamepad ポーリング ─────────────────────────── */
const HAT_CARDINAL = { 0:"up", 2:"right", 4:"down", 6:"left" }; // 斜めは無視
const padPrev = new Map();
let padLearn = null;
let padMonT  = 0;

function readPadInputs(gp) {
  const s = new Set();
  gp.buttons.forEach((b, i) => { if (b.pressed || b.value > 0.6) s.add("b" + i); });
  // 非標準マッピング時、十字キーは axes[9] に8方向hat値で届く（中立は約1.29）
  if (gp.axes.length > 9) {
    const v = gp.axes[9];
    const idx = Math.round((v + 1) * 3.5);
    if (idx >= 0 && idx <= 7 && Math.abs(v - (idx / 3.5 - 1)) < 0.06 && HAT_CARDINAL[idx]) {
      s.add("h:" + HAT_CARDINAL[idx]);
    }
  }
  return s;
}

function padConfigOpen() { return qs("#pad-config").classList.contains("show"); }

function onPadInput(id) {
  if (padLearn) { commitLearn(id); return; }
  if (padConfigOpen()) return;
  if (!currentMode || gameBlocked) return;
  for (const a of PAD_ACTIONS) {
    if ((padMap[a.key] || []).includes(id)) fireAction(a);
  }
}

function pollPads() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const info = [];
  for (const gp of pads) {
    if (!gp) continue;
    const cur  = readPadInputs(gp);
    const prev = padPrev.get(gp.index);
    // 初回は現在状態を記録するだけ（接続時に押しっぱなしのボタンで誤発火しない）
    if (prev) cur.forEach(id => { if (!prev.has(id)) onPadInput(id); });
    padPrev.set(gp.index, cur);
    info.push({ gp, cur });
  }
  if (padConfigOpen()) {
    const t = performance.now();
    if (t - padMonT > 80) { padMonT = t; updatePadMonitor(info); }
  }
}
setInterval(pollPads, 8);

function padToast(text) {
  document.querySelectorAll(".pad-toast").forEach(e => e.remove());
  const d = document.createElement("div");
  d.className = "pad-toast";
  d.textContent = text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2700);
}
window.addEventListener("gamepadconnected", e => {
  padToast("🎮 CONTROLLER CONNECTED");
  console.log("Gamepad connected:", e.gamepad.id, "mapping:", e.gamepad.mapping);
});
window.addEventListener("gamepaddisconnected", e => {
  padPrev.delete(e.gamepad.index);
  padToast("🎮 CONTROLLER DISCONNECTED");
});

/* ── 設定画面 ───────────────────────────────────── */
function idLabel(id) {
  let m;
  if ((m = /^b(\d+)$/.exec(id))) return `BTN ${m[1]}`;
  if ((m = /^h:(\w+)$/.exec(id))) return "十字(hat) " + ({ up:"↑", down:"↓", left:"←", right:"→" }[m[1]] || m[1]);
  return id;
}

function updatePadMonitor(info) {
  const st = qs("#pc-status"), live = qs("#pc-live"), ax = qs("#pc-axes");
  if (!info.length) {
    st.textContent  = "コントローラー未検出 — 画面をクリックしてから、コントローラーのボタンを1つ押してください";
    live.textContent = "-"; ax.textContent = "";
    return;
  }
  st.textContent = info.map(({ gp }) =>
    `#${gp.index} ${gp.id}\n   mapping: ${gp.mapping || "(non-standard)"} / buttons:${gp.buttons.length} / axes:${gp.axes.length}`).join("\n");
  live.textContent = info.map(({ cur }) => [...cur].map(idLabel).join("   ") || "(なし)").join("\n");
  ax.textContent = info.map(({ gp }) => gp.axes.map((v, i) => `${i}:${v.toFixed(2)}`).join("  ")).join("\n");
}

function renderPadConfig() {
  const list = qs("#pc-list");
  list.innerHTML = "";
  [["right", "R BLADER", "r"], ["left", "L BLADER", "l"]].forEach(([side, title, cls]) => {
    const h = document.createElement("div");
    h.className = "pc-group " + cls; h.textContent = title;
    list.appendChild(h);

    PAD_ACTIONS.filter(a => a.side === side).forEach(a => {
      const row = document.createElement("div");
      row.className = "pc-row" + (padLearn === a.key ? " learning" : "");

      const lab = document.createElement("span");
      lab.className = "pc-lab";
      if (a.type === "finish") {
        lab.textContent = `${FINISHES[a.finish].label}  +${FINISHES[a.finish].pts}`;
        lab.style.color = FINISHES[a.finish].color;
      } else {
        lab.textContent = "訂正（−1点）";
      }

      const bind = document.createElement("span");
      bind.className = "pc-bind";
      bind.textContent = padLearn === a.key
        ? "入力待ち… ボタンを押してください（Escで取消）"
        : ((padMap[a.key] || []).map(idLabel).join(" / ") || "未割当");

      const btn = document.createElement("button");
      btn.className = "pc-btn";
      btn.textContent = padLearn === a.key ? "取消" : "割り当て";
      btn.onclick = () => { padLearn = padLearn === a.key ? null : a.key; renderPadConfig(); };

      row.append(lab, bind, btn);
      if (a.type === "finish") {
        const t = document.createElement("button");
        t.className = "pc-btn"; t.textContent = "▶"; t.title = "表示テスト（加点なし）";
        t.onclick = () => showFinishBanner(a.side, a.finish);
        row.append(t);
      } else {
        row.append(document.createElement("span"));
      }
      list.appendChild(row);
    });
  });
}

function commitLearn(id) {
  const key = padLearn;
  padLearn = null;
  for (const k in padMap) padMap[k] = padMap[k].filter(x => x !== id); // 重複割り当てを解消
  padMap[key] = [id];
  savePadMap();
  renderPadConfig();
}

function openPadConfig()  { padLearn = null; qs("#pad-config").classList.add("show"); renderPadConfig(); }
function closePadConfig() { padLearn = null; qs("#pad-config").classList.remove("show"); }

qs("#btn-pad").addEventListener("click", openPadConfig);
qs("#pc-close").addEventListener("click", closePadConfig);
qs("#pc-reset").addEventListener("click", () => {
  padMap = cloneMap(DEFAULT_PAD_MAP); savePadMap(); padLearn = null; renderPadConfig();
});
document.addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("input")) return;
  if (e.key === "g" || e.key === "G") { padConfigOpen() ? closePadConfig() : openPadConfig(); }
  else if (e.key === "Escape") { if (padLearn) { padLearn = null; renderPadConfig(); } else if (padConfigOpen()) closePadConfig(); }
});

</script>
